<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route402</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="chat.css" />
  <link rel="stylesheet" href="screens.css" />
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <!-- Route 402 highway shield: Figma layers (Shield, Shield inset, Shield divider) + live text -->
    <a class="logo" href="#/chat" aria-label="Route402 Agent home">
      <img class="logo-shield" src="assets/shield.svg" width="60" height="66" alt="" />
      <img class="logo-inset" src="assets/shield-inset.svg" width="46" height="53" alt="" />
      <img class="logo-divider" src="assets/shield-divider.svg" width="44" height="3" alt="" />
      <span class="logo-route" aria-hidden="true">ROUTE</span><span class="logo-402" aria-hidden="true">402</span>
    </a>
    <div class="company"><b id="co-name">Your company</b><span id="co-sub">Importer</span></div>
    <nav class="nav" id="nav">
      <a href="#/chat" data-nav="chat"><img class="ico on" src="assets/sparkles-nav.svg" width="17" height="17" alt="" />Agent</a>
      <a href="#/payments" data-nav="payments"><img class="ico" src="assets/arrow-left-right.svg" width="17" height="17" alt="" />Payments</a>
      <a href="#/suppliers" data-nav="suppliers"><img class="ico" src="assets/users.svg" width="17" height="17" alt="" />Suppliers</a>
    </nav>
    <div class="chat-history" id="chat-history" aria-label="Recent work"></div>
    <div class="side-foot">
      <nav class="side-more" aria-label="Workspace tools">
        <a href="#/activity" data-nav="activity">Activity</a>
        <button class="link" id="open-policy">Policy &amp; people</button>
        <button class="link" id="open-connect">Connect bank</button>
      </nav>
      <div class="side-note" id="side-note">Testnet workspace</div>
      <div id="who" class="who"></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="crumbs">
        <button class="icon-btn" id="toggle-side" aria-controls="side" aria-expanded="true" aria-label="Hide sidebar"><img src="assets/panel-left.svg" width="16" height="16" alt="" /></button>
        <span id="crumbs">Route402</span>
      </div>
      <div class="snapshot"><span class="badge" id="mode-badge">TESTNET DEMO</span><span id="clock"></span></div>
    </header>
    <main class="main" id="page"></main>
  </div>
</div>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>
<script src="chat.js"></script>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
